<!DOCTYPE html>
<html>
<head>
    <title>Batch Processing Results</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .no-bullets {
            list-style-type: none;
            padding-left: 0;
        }
    </style>
</head>
<body>
    <h1>Batch Profile Results</h1>

    {% for item in all_results %}
    <div style="border: 1px solid #ccc; padding: 10px; margin: 15px;">
        <h2>{{ item.filename }}</h2>
        <ul>
            {% for key, value in item.results.items() %}
                {% if 'Plot' in key or 'Path' in key %}
                    <li><strong>{{ key }}:</strong></li>
                    <img src="/{{ value }}" alt="{{ key }}" width="400">
                {% else %}
                    <li><strong>{{ key }}:</strong> {{ value }}</li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
    {% endfor %}

    <a href="/upload"><button>Back to Upload</button></a>
</body>
</html>
