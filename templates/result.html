<!DOCTYPE html>
<html>
<head>
    <title>Processed Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>Processed Results</h2>

<ul style="list-style-type: none;">
    {% for key, value in results.items() %}
        <li><strong>{{ key }}:</strong> {{ value }}</li>
    {% endfor %}
</ul>

{% if results['Plot Path'] %}
    <img src="/{{ results['Plot Path'] }}" alt="Plot" style="max-width: 500px;">
{% endif %}



<br><br>

<!-- Add Home Button -->
<a href="/upload" style="text-decoration:none;">
    <button style="padding:10px 20px; font-size:16px;">Home</button>
  </a>
  
</body>
</html>
